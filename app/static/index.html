<!doctype html>
<html lang="hr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>kuzi-order</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 920px;
        margin: 2rem auto;
        padding: 0 1rem;
      }
      .layout {
        display: flex;
        gap: 2.5rem;
        align-items: flex-start;
      }
      .order {
        flex: 1;
        min-width: 0;
      }
      #menu {
        flex: 0 0 270px;
        border-left: 1px solid #e5e5e5;
        padding-left: 1.5rem;
      }
      @media (max-width: 760px) {
        .layout {
          flex-direction: column;
        }
        #menu {
          flex: none;
          border-left: none;
          padding-left: 0;
        }
      }
      h1 {
        font-size: 1.4rem;
      }
      textarea {
        width: 100%;
        box-sizing: border-box;
        height: 5rem;
        padding: 0.5rem;
        font-size: 1rem;
        resize: vertical;
      }
      button {
        margin: 0.5rem 0 1rem;
        padding: 0.5rem 1.5rem;
        font-size: 1rem;
        cursor: pointer;
      }
      button:disabled {
        cursor: wait;
        opacity: 0.6;
      }
      #response {
        box-sizing: border-box;
        width: 100%;
        min-height: 8rem;
        padding: 0.5rem;
        font-family: monospace;
        font-size: 0.9rem;
        white-space: pre-wrap;
        background: #f5f5f5;
        border: 1px solid #ccc;
      }
      #response.error {
        color: #b00020;
        background: #fdecea;
        border-color: #b00020;
      }
      #hint {
        color: #666;
        font-size: 0.85rem;
      }
      #menu {
        margin-top: 0;
      }
      #menu h2 {
        font-size: 1.1rem;
      }
      #menu h3 {
        font-size: 0.85rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: #666;
        margin: 1rem 0 0.25rem;
      }
      .menu-item {
        display: flex;
        align-items: baseline;
        gap: 0.4rem;
        padding: 0.15rem 0;
        font-size: 0.95rem;
      }
      .menu-item .name {
        flex: none;
      }
      .menu-item .vege {
        margin-right: 0.15rem;
      }
      .menu-item code {
        font-size: 0.75rem;
        color: #888;
        background: #f5f5f5;
        padding: 0 0.3rem;
        border-radius: 3px;
      }
      .menu-item .dots {
        flex: 1;
        border-bottom: 1px dotted #bbb;
      }
      .menu-item .price {
        flex: none;
        font-variant-numeric: tabular-nums;
      }
    </style>
  </head>
  <body>
    <h1>kuzi-order</h1>
    <main class="layout">
      <section class="order">
        <p id="hint">Primjer: "dva hamburgera, dvije margarite i jednu colu"</p>
        <textarea id="order-text" placeholder="Unesite narudžbu..."></textarea>
        <button id="send">Naruči</button>
        <div id="response"></div>
      </section>
      <aside id="menu"><h2>Jelovnik</h2></aside>
    </main>
    <script>
      const button = document.getElementById("send");
      const textBox = document.getElementById("order-text");
      const responseBox = document.getElementById("response");

      function show(text, isError) {
        responseBox.textContent = text;
        responseBox.classList.toggle("error", isError);
      }

      async function send() {
        const text = textBox.value.trim();
        if (!text) {
          show("Unesite tekst narudžbe.", true);
          return;
        }
        button.disabled = true;
        show("Slanje...", false);
        try {
          const res = await fetch("/order", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ text: text }),
          });
          const data = await res.json();
          if (!res.ok) {
            show(`Greška (${res.status}): ${JSON.stringify(data)}`, true);
          } else {
            show(JSON.stringify(data, null, 2), false);
          }
        } catch (err) {
          show(`Greška: ${err}`, true);
        } finally {
          button.disabled = false;
        }
      }

      button.addEventListener("click", send);
      textBox.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) send();
      });

      async function loadMenu() {
        const box = document.getElementById("menu");
        try {
          const res = await fetch("/menu");
          if (!res.ok) throw new Error(res.status);
          const items = await res.json();
          const groups = new Map();
          for (const item of items) {
            if (!groups.has(item.kategorija)) groups.set(item.kategorija, []);
            groups.get(item.kategorija).push(item);
          }
          box.replaceChildren();
          const heading = document.createElement("h2");
          heading.textContent = "Jelovnik";
          box.appendChild(heading);
          for (const [category, group] of groups) {
            const h = document.createElement("h3");
            h.textContent = category;
            box.appendChild(h);
            for (const item of group) {
              const row = document.createElement("div");
              row.className = "menu-item";
              const name = document.createElement("span");
              name.className = "name";
              if (item.bez_mesa) {
                const vege = document.createElement("span");
                vege.className = "vege";
                vege.textContent = "🥗";
                vege.title = "Bez mesa";
                name.appendChild(vege);
              }
              name.appendChild(document.createTextNode(item.naziv + " "));
              const badge = document.createElement("code");
              badge.textContent = item.id;
              name.appendChild(badge);
              const dots = document.createElement("span");
              dots.className = "dots";
              const price = document.createElement("span");
              price.className = "price";
              price.textContent = item.cijena_eur.toFixed(2).replace(".", ",") + " €";
              row.append(name, dots, price);
              box.appendChild(row);
            }
          }
        } catch {
          box.replaceChildren();
          const heading = document.createElement("h2");
          heading.textContent = "Jelovnik";
          box.appendChild(heading);
          box.appendChild(document.createTextNode("Jelovnik nije dostupan."));
        }
      }

      loadMenu();
    </script>
  </body>
</html>
