<!doctype html>
<html lang="hr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>kuzi-order</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 640px;
        margin: 2rem auto;
        padding: 0 1rem;
      }
      h1 {
        font-size: 1.4rem;
      }
      textarea {
        width: 100%;
        box-sizing: border-box;
        height: 5rem;
        padding: 0.5rem;
        font-size: 1rem;
        resize: vertical;
      }
      button {
        margin: 0.5rem 0 1rem;
        padding: 0.5rem 1.5rem;
        font-size: 1rem;
        cursor: pointer;
      }
      button:disabled {
        cursor: wait;
        opacity: 0.6;
      }
      #response {
        box-sizing: border-box;
        width: 100%;
        min-height: 8rem;
        padding: 0.5rem;
        font-family: monospace;
        font-size: 0.9rem;
        white-space: pre-wrap;
        background: #f5f5f5;
        border: 1px solid #ccc;
      }
      #response.error {
        color: #b00020;
        background: #fdecea;
        border-color: #b00020;
      }
      #hint {
        color: #666;
        font-size: 0.85rem;
      }
    </style>
  </head>
  <body>
    <h1>kuzi-order</h1>
    <p id="hint">Primjer: "dva hamburgera, dvije margarite i jednu colu"</p>
    <textarea id="order-text" placeholder="Unesite narudžbu..."></textarea>
    <button id="send">Naruči</button>
    <div id="response"></div>
    <script>
      const button = document.getElementById("send");
      const textBox = document.getElementById("order-text");
      const responseBox = document.getElementById("response");

      function show(text, isError) {
        responseBox.textContent = text;
        responseBox.classList.toggle("error", isError);
      }

      async function send() {
        const text = textBox.value.trim();
        if (!text) {
          show("Unesite tekst narudžbe.", true);
          return;
        }
        button.disabled = true;
        show("Slanje...", false);
        try {
          const res = await fetch("/order", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ text: text }),
          });
          const data = await res.json();
          if (!res.ok) {
            show(`Greška (${res.status}): ${JSON.stringify(data)}`, true);
          } else {
            show(JSON.stringify(data, null, 2), false);
          }
        } catch (err) {
          show(`Greška: ${err}`, true);
        } finally {
          button.disabled = false;
        }
      }

      button.addEventListener("click", send);
      textBox.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) send();
      });
    </script>
  </body>
</html>
